<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <!-- Gradiente exato: Azul Céu suave até Lilás/Púrpura -->
    <linearGradient id="cnGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ea8fe"/>
      <stop offset="55%" stop-color="#6e9bfb"/>
      <stop offset="100%" stop-color="#b18dfa"/>
    </linearGradient>
  </defs>

  <!-- Squircle / Quadrado Arredondado -->
  <rect width="100" height="100" rx="28" fill="url(#cnGrad)"/>

  <!-- Tipografia Pesada C&N Centralizada -->
  <text 
    x="50" 
    y="61" 
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
    font-size="31" 
    font-weight="900" 
    letter-spacing="-1px" 
    fill="#ffffff" 
    text-anchor="middle">C&amp;N</text>
</svg>
